<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz result — InfuMedz</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E5FD8'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='18' font-weight='900' fill='white' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">
</head>
<body class="bg-canvas">

<div data-header></div>
<main class="shell py-8" data-main>
  <div class="grid gap-6 lg:grid-cols-[1fr_360px]"><div class="sk h-64"></div><div class="sk h-64"></div></div>
</main>
<div data-footer></div>

<script type="module">
import { api } from './assets/js/api.js';
import { session } from './assets/js/session.js';
import { boot, emptyState, fmt, toast } from './assets/js/ui.js';
import { duration, num, pct } from './assets/js/quiz-ui.js';

boot('quizzes.html');
const $ = (s) => document.querySelector(s);
const attemptId = new URLSearchParams(location.search).get('attempt') || '';
if (!session.requireLogin('quiz-result.html?attempt=' + attemptId)) throw new Error('not signed in');

let R = null;
let filter = 'all';
const GOOD = '#0F766E', BAD = '#C2410C', WARN = '#B45309';

function ring(p, colour) {
  const r = 52, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, Number(p) || 0));
  return '<svg viewBox="0 0 128 128" class="h-32 w-32 -rotate-90" aria-hidden="true">' +
    '<circle cx="64" cy="64" r="' + r + '" fill="none" stroke="#E2E8F0" stroke-width="11"/>' +
    '<circle cx="64" cy="64" r="' + r + '" fill="none" stroke="' + colour + '" stroke-width="11" stroke-linecap="round" stroke-dasharray="' + (c * v / 100) + ' ' + c + '"/></svg>';
}

function bar(row) {
  const p = Number(row.percent) || 0;
  const colour = p >= 70 ? GOOD : p >= 40 ? WARN : BAD;
  return '<div class="py-2"><div class="flex items-center justify-between gap-3 text-sm">' +
    '<span class="line-1 font-semibold text-navy">' + fmt.esc(row.title) + '</span>' +
    '<span class="shrink-0 text-ink-muted">' + row.correct + '/' + row.total + ' <b style="color:' + colour + '">' + pct(row.percent) + '</b></span></div>' +
    '<div class="mt-1.5 h-2 overflow-hidden rounded-full bg-line"><div class="h-2 rounded-full" style="width:' + p + '%;background:' + colour + '"></div></div></div>';
}

function aiPanel() {
  const ai = R.ai_review;
  if (!ai) {
    return '<section class="card p-6" data-ai>' +
      '<h2 class="text-lg">AI review</h2>' +
      '<p class="prose-brand mt-2 text-sm">Get a short review of what you missed, which topics to revise and what to do next.</p>' +
      '<p class="mt-2 text-xs text-ink-muted">Only the questions and your answers are sent to our AI provider (Groq) — never your name or contact details.</p>' +
      '<button class="btn-ghost mt-4" data-ai-go>Get AI review</button><p class="mt-2 text-sm text-bad" data-ai-err></p></section>';
  }
  const list = (items, colour) => '<ul class="mt-2 space-y-1.5">' + items.map((t) => '<li class="flex gap-2 text-sm"><span class="mt-2 h-1.5 w-1.5 shrink-0 rounded-full" style="background:' + colour + '"></span><span>' + fmt.esc(t) + '</span></li>').join('') + '</ul>';
  const head = (t) => '<p class="mt-5 text-xs font-bold uppercase tracking-wider text-ink-muted">' + t + '</p>';
  return '<section class="card p-6" data-ai><h2 class="text-lg">AI review</h2>' +
    '<p class="mt-3 font-bold text-navy">' + fmt.esc(ai.headline) + '</p>' +
    (ai.summary ? '<p class="prose-brand mt-1.5 text-sm">' + fmt.esc(ai.summary) + '</p>' : '') +
    ((ai.strengths || []).length ? head('Strengths') + list(ai.strengths, GOOD) : '') +
    ((ai.focus_areas || []).length ? head('Focus on') + '<div class="mt-2 space-y-2">' + ai.focus_areas.map((f) =>
      '<div class="rounded-lg border p-3" style="border-color:#B4530940;background:#B453090D"><p class="font-bold text-navy">' + fmt.esc(f.topic) + '</p>' +
      (f.why ? '<p class="mt-0.5 text-sm text-ink-muted">' + fmt.esc(f.why) + '</p>' : '') +
      (f.tip ? '<p class="mt-1 text-sm font-semibold text-navy">' + fmt.esc(f.tip) + '</p>' : '') + '</div>').join('') + '</div>' : '') +
    ((ai.missed_concepts || []).length ? head('Key facts you missed') + list(ai.missed_concepts.map((m) => m.question + ': ' + m.concept), BAD) : '') +
    ((ai.next_steps || []).length ? head('Next steps') + list(ai.next_steps, '#0E5FD8') : '') +
    '<p class="mt-4 text-xs text-ink-muted">AI-generated. Check important facts against your textbook.</p></section>';
}

function reviewCard(r) {
  const tag = { true: ['Correct', GOOD], false: ['Wrong', BAD], skipped: ['Skipped', '#64748B'] }[String(r.result)] || ['Not graded', '#64748B'];
  let body;
  if (r.question_type === 'text') {
    body = '<p class="mt-3 text-sm">Your answer: <b style="color:' + (r.result === true ? GOOD : BAD) + '">' + fmt.esc(r.your_text || '(not answered)') + '</b></p>' +
      '<p class="mt-1 text-sm">Accepted: <b style="color:' + GOOD + '">' + fmt.esc((r.accepted_answers || []).join(', ')) + '</b></p>';
  } else {
    body = '<ul class="mt-3 space-y-1.5">' + r.options.map((o) => {
      const ok = r.correct_options.includes(o.id), picked = r.your_selected.includes(o.id);
      const colour = ok ? GOOD : picked ? BAD : '';
      return '<li class="flex items-start gap-2 text-sm"><span class="mt-0.5 grid h-4 w-4 shrink-0 place-items-center rounded-full text-[10px] font-bold text-white" style="background:' + (ok ? GOOD : picked ? BAD : '#E2E8F0') + '">' + (ok ? '✓' : picked ? '✕' : '') + '</span>' +
        '<span style="' + (colour ? 'color:' + colour + ';font-weight:600' : '') + '">' + fmt.esc(o.text) + (picked ? ' <span class="font-normal text-ink-muted">(your answer)</span>' : '') + '</span></li>';
    }).join('') + '</ul>';
  }
  return '<article class="rounded-xl border border-line bg-white p-5">' +
    '<div class="flex items-center gap-2 text-xs"><b class="text-sm text-navy">Q' + r.number + '</b>' +
      '<span class="rounded px-1.5 py-0.5 font-bold" style="color:' + tag[1] + ';background:' + tag[1] + '1A">' + tag[0] + '</span>' +
      (r.flagged ? '<span class="font-bold" style="color:' + WARN + '">⚑ flagged</span>' : '') +
      '<span class="ml-auto line-1 text-ink-muted">' + fmt.esc(r.topic || r.section_title || '') + '</span></div>' +
    '<p class="mt-2 font-semibold leading-relaxed text-navy">' + fmt.esc(r.question) + '</p>' +
    (r.image_url ? '<img src="' + fmt.esc(r.image_url) + '" alt="" class="mt-3 max-h-80 rounded-lg border border-line">' : '') +
    body +
    (r.explanation ? '<div class="mt-3 rounded-lg bg-canvas p-3 text-sm leading-relaxed text-ink">' + fmt.esc(r.explanation) + '</div>' : '') +
  '</article>';
}

function reviewList() {
  const items = (R.review || []).filter((r) => filter === 'all' || (filter === 'flagged' ? r.flagged : (filter === 'correct' ? r.result === true : filter === 'wrong' ? r.result === false : r.result === 'skipped')));
  return items.length ? items.map(reviewCard).join('') : '<p class="text-sm text-ink-muted">Nothing here.</p>';
}

function render() {
  const a = R.attempt, q = R.quiz;
  const colour = a.passed ? GOOD : BAD;
  const counts = {
    all: R.review.length,
    wrong: R.review.filter((r) => r.result === false).length,
    skipped: R.review.filter((r) => r.result === 'skipped').length,
    correct: R.review.filter((r) => r.result === true).length,
    flagged: R.review.filter((r) => r.flagged).length,
  };
  const labels = { all: 'All', wrong: 'Wrong', skipped: 'Skipped', correct: 'Correct', flagged: 'Flagged' };
  const courseTitle = q.course_title || q.title;
  const chapter = R.test && R.test.chapter_title ? R.test.chapter_title : '';
  document.title = 'Result: ' + q.title + ' — InfuMedz';
  $('[data-main]').innerHTML =
    '<nav class="mb-4 flex items-center gap-2 text-xs text-ink-muted"><a href="quizzes.html" class="hover:text-primary">MCQ Quizzes</a><span>/</span>' +
      '<a href="quiz.html?id=' + encodeURIComponent(q.id) + '" class="line-1 hover:text-primary">' + fmt.esc(courseTitle) + '</a><span>/</span><span class="text-navy">Result</span></nav>' +
    '<div class="grid gap-6 lg:grid-cols-[1fr_360px]">' +
      '<div class="min-w-0 space-y-6">' +
        '<section class="card p-6">' +
          (R.test ? '<p class="text-xs font-bold uppercase tracking-wider text-ink-muted">' + fmt.esc([chapter, courseTitle].filter(Boolean).join(' · ')) + '</p>' : '') +
          '<h1 class="text-xl sm:text-2xl">' + fmt.esc(q.title) + '</h1>' +
          '<p class="text-sm text-ink-muted">' + (R.attempt_number ? 'Attempt ' + R.attempt_number + ' · ' : '') + fmt.date(a.submitted_at) + (a.time_spent_seconds ? ' · ' + duration(a.time_spent_seconds) : '') + '</p>' +
          (a.auto_submitted ? '<p class="mt-3 rounded-lg bg-warn/10 px-3 py-2 text-sm font-semibold text-ink">⏱ Time ran out, so your saved answers were submitted automatically.</p>' : '') +
          '<div class="mt-5 flex flex-wrap items-center gap-6">' +
            '<div class="relative">' + ring(a.percent, colour) +
              '<div class="absolute inset-0 grid place-items-center text-center"><div><div class="text-2xl font-black" style="color:' + colour + '">' + pct(a.percent) + '</div><div class="text-xs text-ink-muted">' + num(a.score) + ' / ' + num(a.max_score) + '</div></div></div></div>' +
            '<div><span class="rounded-md px-2.5 py-1 text-sm font-bold" style="color:' + colour + ';background:' + colour + '1A">' + (a.passed ? 'Passed' : 'Not passed yet') + '</span>' +
              '<p class="mt-2 text-sm text-ink-muted">Pass mark ' + q.pass_percent + '%' + (Number(q.negative_mark) > 0 ? ' · −' + num(q.negative_mark) + ' per wrong' : '') + '</p>' +
              (R.best_percent != null && (R.attempt_number || 1) > 1 ? '<p class="text-sm text-ink-muted">Your best ' + pct(R.best_percent) + '</p>' : '') + '</div>' +
          '</div>' +
          '<div class="mt-5 grid grid-cols-3 gap-3">' +
            ['Correct|' + a.correct + '|' + GOOD, 'Wrong|' + a.wrong + '|' + BAD, 'Skipped|' + a.skipped + '|#64748B'].map((s) => { const [l, v, c] = s.split('|');
              return '<div class="rounded-xl border border-line p-3"><div class="text-2xl font-black" style="color:' + c + '">' + v + '</div><div class="text-xs text-ink-muted">' + l + '</div></div>'; }).join('') +
          '</div>' +
        '</section>' +
        '<section class="card p-6"><div class="flex flex-wrap items-center justify-between gap-3"><h2 class="text-lg">Review answers</h2>' +
          '<div class="flex flex-wrap gap-1.5" data-filters>' + Object.keys(labels).filter((k) => k === 'all' || counts[k]).map((k) =>
            '<button data-f="' + k + '" class="rounded-full border px-3 py-1 text-xs font-semibold ' + (filter === k ? 'border-primary bg-chip text-primary' : 'border-line text-navy') + '">' + labels[k] + ' ' + counts[k] + '</button>').join('') + '</div></div>' +
          '<div class="mt-4 space-y-3" data-review>' + reviewList() + '</div></section>' +
      '</div>' +
      '<aside class="space-y-6">' +
        '<section class="card p-6"><div class="grid gap-2">' +
          '<button class="btn-primary w-full" data-retake>' + (R.test ? 'Retake this quiz' : 'Retake quiz') + '</button>' +
          '<a class="btn-ghost w-full" href="quiz.html?id=' + encodeURIComponent(q.id) + '">All quizzes in this course</a>' +
          '<button class="btn-ghost w-full" data-email>' + (R.emailed_at ? 'E-mail result again' : 'E-mail me this result') + '</button>' +
          '<button class="btn-ghost w-full" onclick="window.print()">Print / save as PDF</button>' +
        '</div></section>' +
        ((R.sections || []).length > 1 || ((R.sections || [])[0] && R.sections[0].title !== 'General') ? '<section class="card p-6"><h2 class="text-lg">By section</h2><div class="mt-2">' + R.sections.map(bar).join('') + '</div></section>' : '') +
        ((R.topics || []).length ? '<section class="card p-6"><h2 class="text-lg">By topic <span class="text-xs font-normal text-ink-muted">weakest first</span></h2><div class="mt-2">' + R.topics.slice(0, 8).map(bar).join('') + '</div></section>' : '') +
        aiPanel() +
      '</aside>' +
    '</div>';
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('button');
  if (!t || !R) return;
  if (t.matches('[data-f]')) {
    filter = t.dataset.f;
    document.querySelectorAll('[data-f]').forEach((b) => { b.className = 'rounded-full border px-3 py-1 text-xs font-semibold ' + (b.dataset.f === filter ? 'border-primary bg-chip text-primary' : 'border-line text-navy'); });
    $('[data-review]').innerHTML = reviewList();
  } else if (t.matches('[data-ai-go]')) {
    t.disabled = true; t.textContent = 'Reviewing your answers…';
    try {
      const r = await api.quizAiReview(attemptId, session.userId);
      R.ai_review = r.ai_review;
      $('[data-ai]').outerHTML = aiPanel();
    } catch (err) {
      t.disabled = false; t.textContent = 'Get AI review';
      $('[data-ai-err]').textContent = err.message || 'The AI review is not available right now.';
    }
  } else if (t.matches('[data-email]')) {
    t.disabled = true;
    try {
      const r = await api.quizEmail(attemptId, session.userId);
      R.emailed_at = new Date().toISOString();
      toast('Result sent to ' + (r.to || 'your e-mail') + '.', 'success');
      t.textContent = 'E-mail result again';
    } catch (err) {
      toast(err.message || 'Could not send the e-mail.', 'error');
    }
    t.disabled = false;
  } else if (t.matches('[data-retake]')) {
    t.disabled = true; t.textContent = 'Starting…';
    try {
      const s = R.test ? await api.quizTestStart(R.test.id, session.userId) : await api.quizStart(R.quiz.id, session.userId);
      location.href = 'quiz-play.html?attempt=' + encodeURIComponent(s.attempt.id);
    } catch (err) {
      t.disabled = false; t.textContent = R.test ? 'Retake this quiz' : 'Retake quiz';
      toast(err.message || 'Could not start a new attempt.', 'error');
    }
  }
});

async function load() {
  R = await api.quizAttempt(attemptId, session.userId);
  if (!R.attempt || R.attempt.status !== 'submitted') { location.replace('quiz-play.html?attempt=' + encodeURIComponent(attemptId)); return; }
  R.review = R.review || [];
  render();
}

load().catch((e) => {
  $('[data-main]').innerHTML = emptyState('Result not available', e.message || 'This result could not be loaded.',
    '<a href="quizzes.html" class="btn-primary btn-sm">Browse quizzes</a>');
});
</script>
</body>
</html>
