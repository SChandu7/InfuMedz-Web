<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCQ Quiz — InfuMedz</title>
<meta name="description" content="Exam-style MCQ quiz course from InfuMedz with explanations, analysis and an AI review.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E5FD8'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='18' font-weight='900' fill='white' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">
<script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
</head>
<body class="bg-canvas">

<div data-header></div>
<main data-main>
  <div class="shell py-10"><div class="grid gap-8 lg:grid-cols-[1fr_340px]"><div class="space-y-4"><div class="sk aspect-video"></div><div class="sk h-8 w-2/3"></div><div class="sk h-4 w-1/2"></div></div><div class="sk h-64"></div></div></div>
</main>
<div data-footer></div>

<script type="module">
import { api, ApiError } from './assets/js/api.js';
import { session } from './assets/js/session.js';
import { boot, emptyState, fmt, toast } from './assets/js/ui.js';
import { accessLabel, clock, cover, num, pct, plural, timeLimit } from './assets/js/quiz-ui.js';

boot('quizzes.html');
const $ = (s) => document.querySelector(s);
const id = new URLSearchParams(location.search).get('id') || '';
let d = null;
let busy = false;

const check = (t) => '<li class="flex gap-2.5"><svg class="mt-0.5 h-5 w-5 shrink-0 text-ok" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 0 1 0 1.4l-8 8a1 1 0 0 1-1.4 0l-4-4 1.4-1.4L8 12.6l7.3-7.3a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/></svg><span>' + fmt.esc(t) + '</span></li>';
const fact = (t) => '<span class="rounded-lg border border-line bg-white px-3 py-1.5 text-sm font-medium text-navy">' + t + '</span>';
const block = (title, body, sub) => '<section class="card p-6"><h2 class="text-lg">' + title + '</h2>' + (sub ? '<p class="mt-1 text-sm text-ink-muted">' + sub + '</p>' : '') + '<div class="mt-4">' + body + '</div></section>';

function sample(q, i) {
  const icon = q.question_type === 'multiple' ? '<span class="h-4 w-4 rounded border-2 border-line"></span>' : '<span class="h-4 w-4 rounded-full border-2 border-line"></span>';
  return '<div class="rounded-xl border border-line p-4">' +
    '<p class="text-xs font-bold text-primary">Q' + (i + 1) + ' · ' + (q.question_type === 'multiple' ? 'Choose all that apply' : q.question_type === 'text' ? 'Typed answer' : 'Choose one') + '</p>' +
    '<p class="mt-1.5 font-semibold text-navy">' + fmt.esc(q.question) + '</p>' +
    (q.image_url ? '<img src="' + fmt.esc(q.image_url) + '" alt="" class="mt-3 max-h-72 rounded-lg border border-line">' : '') +
    '<ul class="mt-3 space-y-2">' + (q.options || []).map((o) => '<li class="flex items-center gap-2.5 text-sm text-ink-soft">' + icon + fmt.esc(o.text) + '</li>').join('') + '</ul>' +
  '</div>';
}

const tree = () => (d.chapters || []).length > 0;
const allQuizzes = () => (d.chapters || []).flatMap((c) => (c.quizzes || []).map((q) => Object.assign({ chapter: c.title }, q)));

/* The quiz the main button opens: one in progress, else the first not yet
   taken, else the first one. Only quizzes this user may open. */
function nextQuiz() {
  const open = allQuizzes().filter((q) => !q.locked && q.question_count > 0);
  return open.find((q) => q.in_progress) || open.find((q) => !q.attempts) || open[0] || null;
}

function quizRow(q) {
  const ip = q.in_progress;
  const facts = [plural(q.question_count, 'question'), q.time_limit_minutes ? '⏱ ' + timeLimit(q.time_limit_minutes) : 'No time limit'];
  if (q.attempts) facts.push(plural(q.attempts, 'attempt') + ' · best ' + pct(q.best_percent));
  let btn;
  if (q.locked) btn = '<button class="btn-ghost btn-sm" data-locked="' + q.id + '">🔒 Locked</button>';
  else if (!q.question_count) btn = '<span class="text-xs text-ink-muted">Coming soon</span>';
  else if (ip) btn = '<button class="btn-primary btn-sm" data-test="' + q.id + '">Resume</button>';
  else btn = '<button class="' + (q.attempts ? 'btn-ghost' : 'btn-primary') + ' btn-sm" data-test="' + q.id + '">' + (q.attempts ? 'Retake' : 'Start') + '</button>';
  return '<li class="py-3">' +
    '<div class="flex items-center gap-3">' +
      '<div class="min-w-0 flex-1">' +
        '<p class="flex flex-wrap items-center gap-2 font-semibold text-navy">' + fmt.esc(q.title) +
          (q.is_free && !(d.access && d.access.has_access) ? '<span class="rounded bg-ok/10 px-1.5 py-0.5 text-[10px] font-black text-ok">FREE</span>' : '') + '</p>' +
        (q.description ? '<p class="mt-0.5 text-sm text-ink-muted">' + fmt.esc(q.description) + '</p>' : '') +
        '<p class="mt-0.5 text-xs text-ink-muted">' + facts.join(' · ') + (ip ? ' · <b class="text-warn">in progress (' + ip.answered + '/' + ip.total + ')</b>' : '') + '</p>' +
      '</div>' +
      '<div class="flex shrink-0 flex-col items-end gap-1">' + btn +
        (q.last_attempt_id ? '<button class="text-xs font-semibold text-primary hover:underline" data-results="' + q.id + '">Results</button>' : '') +
      '</div>' +
    '</div>' +
    '<div data-results-list="' + q.id + '"></div>' +
  '</li>';
}

function chaptersBlock() {
  const chapters = d.chapters || [];
  const body = chapters.map((c, i) =>
    '<details class="group rounded-xl border border-line"' + (i === 0 || chapters.length <= 3 ? ' open' : '') + '>' +
      '<summary class="flex cursor-pointer list-none items-center justify-between gap-3 px-4 py-3">' +
        '<span class="flex items-center gap-2.5 font-bold text-navy"><svg class="h-5 w-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>' + fmt.esc(c.title) + '</span>' +
        '<span class="text-sm text-ink-muted">' + plural(c.quizzes.length, 'quiz', 'quizzes') + '</span>' +
      '</summary>' +
      (c.description ? '<p class="px-4 text-sm text-ink-muted">' + fmt.esc(c.description) + '</p>' : '') +
      '<ul class="divide-y divide-line px-4">' + c.quizzes.map(quizRow).join('') + '</ul>' +
    '</details>').join('');
  const sub = (d.access && d.access.has_access) ? 'Take each quiz as many times as you like. Every attempt is saved.'
    : (d.free_quiz_count ? plural(d.free_quiz_count, 'quiz', 'quizzes') + ' free to try. Buy the course to unlock the rest.' : 'Buy the course to unlock every quiz.');
  return block('Chapters & quizzes', '<div class="space-y-3">' + body + '</div>', sub);
}

function sidebar() {
  const a = d.access || {};
  const p = d.progress || {};
  const free = Number(d.price) === 0;
  const priceLine = free ? 'Free' : fmt.price(d.price);
  let actions = '';
  if (!session.isLoggedIn) {
    actions = '<a class="btn-primary w-full" href="login.html?next=' + encodeURIComponent('quiz.html?id=' + id) + '">Sign in to ' + (free ? 'start' : 'buy') + '</a>';
  } else if (tree()) {
    const n = nextQuiz();
    actions = n ? '<button class="btn-primary w-full" data-test="' + n.id + '">' + (n.in_progress ? 'Resume: ' : (n.attempts ? 'Practise: ' : 'Start: ')) + fmt.esc(n.title) + '</button>' : '';
    if (!a.has_access) actions += '<button class="' + (n ? 'btn-ghost mt-2' : 'btn-primary') + ' w-full" data-buy>' + (a.owned ? 'Renew' : (free ? 'Get it free' : 'Buy course')) + (free ? '' : ' · ' + priceLine) + '</button>';
    else if (a.can_renew) actions += '<button class="btn-ghost mt-2 w-full" data-buy>Renew · ' + priceLine + '</button>';
  } else if (a.has_access) {
    const ip = p.in_progress;
    actions = '<button class="btn-primary w-full" data-start>' + (ip ? 'Resume (' + ip.answered + '/' + ip.total + ' answered' + (ip.seconds_left != null ? ', ' + clock(ip.seconds_left) + ' left' : '') + ')' : (p.attempts ? 'Start new attempt' : 'Start quiz')) + '</button>' +
      (a.can_renew ? '<button class="btn-ghost mt-2 w-full" data-buy>Renew · ' + priceLine + '</button>' : '');
  } else {
    actions = '<button class="btn-primary w-full" data-buy>' + (a.owned ? 'Renew' : (free ? 'Get it free' : 'Buy')) + (free ? '' : ' · ' + priceLine) + '</button>';
  }
  const label = accessLabel(a);
  const progress = tree() ? ((p.attempts || p.in_progress) ?
    '<div class="mt-5 border-t border-line pt-5">' +
      '<p class="text-xs font-bold uppercase tracking-wider text-ink-muted">Your progress</p>' +
      '<div class="mt-3 grid grid-cols-3 gap-2 text-center">' +
        '<div class="rounded-lg bg-canvas p-2"><div class="text-lg font-black text-navy">' + (p.quizzes_done || 0) + '/' + (p.quiz_count || 0) + '</div><div class="text-[11px] text-ink-muted">Quizzes done</div></div>' +
        '<div class="rounded-lg bg-canvas p-2"><div class="text-lg font-black text-navy">' + pct(p.average_best) + '</div><div class="text-[11px] text-ink-muted">Avg best</div></div>' +
        '<div class="rounded-lg bg-canvas p-2"><div class="text-lg font-black text-navy">' + (p.attempts || 0) + '</div><div class="text-[11px] text-ink-muted">Attempts</div></div>' +
      '</div>' +
      (p.last ? '<a class="mt-3 block text-sm font-semibold text-primary hover:underline" href="quiz-result.html?attempt=' + encodeURIComponent(p.last.id) + '">View last result →</a>' : '') +
    '</div>' : '') : (a.owned && (p.attempts || p.in_progress)) ?
    '<div class="mt-5 border-t border-line pt-5">' +
      '<p class="text-xs font-bold uppercase tracking-wider text-ink-muted">Your progress</p>' +
      '<div class="mt-3 grid grid-cols-3 gap-2 text-center">' +
        '<div class="rounded-lg bg-canvas p-2"><div class="text-lg font-black text-navy">' + (p.attempts || 0) + '</div><div class="text-[11px] text-ink-muted">Attempts</div></div>' +
        '<div class="rounded-lg bg-canvas p-2"><div class="text-lg font-black text-navy">' + pct(p.best_percent) + '</div><div class="text-[11px] text-ink-muted">Best</div></div>' +
        '<div class="rounded-lg bg-canvas p-2"><div class="text-lg font-black text-navy">' + pct(p.last && p.last.percent) + '</div><div class="text-[11px] text-ink-muted">Last</div></div>' +
      '</div>' +
      (p.last ? '<a class="mt-3 block text-sm font-semibold text-primary hover:underline" href="quiz-result.html?attempt=' + encodeURIComponent(p.last.id) + '">View last result →</a>' : '') +
      (p.attempts > 1 ? '<button class="mt-1 block text-sm font-semibold text-primary hover:underline" data-history>All attempts</button>' : '') +
      '<div data-history-list></div>' +
    '</div>' : '';
  return '<div class="card p-6 lg:sticky lg:top-24">' +
    (a.has_access ? '' : '<div class="text-3xl font-black text-navy">' + priceLine + '</div>') +
    '<p class="mt-1 text-sm ' + (a.expired || a.can_renew ? 'font-semibold text-warn' : 'text-ink-muted') + '">' +
      fmt.esc(label || '12 months access · unlimited attempts · web and app') + '</p>' +
    '<div class="mt-4">' + actions + '</div>' +
    '<button class="btn-ghost mt-2 w-full" data-share>' +
      '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>' +
      'Share</button>' +
    '<ul class="mt-5 space-y-2 text-sm text-ink-soft">' +
      (tree() ? '<li>' + plural(d.chapter_count || d.chapters.length, 'chapter') + ' · ' + plural(d.quiz_count || allQuizzes().length, 'quiz', 'quizzes') + '</li>' : '') +
      '<li>' + plural(d.question_count || 0, 'question') + (d.total_marks ? ' · ' + d.total_marks + ' marks' : '') + '</li>' +
      '<li>Pass mark ' + d.pass_percent + '%</li>' +
      '<li>' + (Number(d.negative_mark) > 0 ? '−' + num(d.negative_mark) + ' mark per wrong answer' : 'No negative marking') + '</li>' +
      (tree() ? '<li>Unlimited retakes · every attempt saved</li>' :
      '<li>' + (d.time_limit_minutes ? '<b class="text-navy">' + timeLimit(d.time_limit_minutes) + '</b> per attempt · submitted automatically at zero' : 'No time limit · progress saved') + '</li>') +
    '</ul>' + progress +
  '</div>';
}

function render() {
  document.title = d.title + ' — MCQ Quiz — InfuMedz';
  const owned = d.access && d.access.has_access;
  const inside = (d.sections || []).map((s) =>
    '<li class="flex items-center justify-between gap-3 py-3"><span class="flex items-center gap-2.5 font-semibold text-navy">' +
    '<svg class="h-5 w-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>' +
    fmt.esc(s.title) + '</span><span class="text-sm text-ink-muted">' + plural(s.question_count, 'question') + '</span></li>').join('');
  $('[data-main]').innerHTML =
    '<div class="border-b border-line bg-white"><div class="shell py-6">' +
      '<nav class="flex items-center gap-2 text-xs text-ink-muted" aria-label="Breadcrumb"><a href="index.html" class="hover:text-primary">Home</a><span>/</span><a href="quizzes.html" class="hover:text-primary">MCQ Quizzes</a><span>/</span><span class="font-medium text-navy line-1">' + fmt.esc(d.title) + '</span></nav>' +
    '</div></div>' +
    '<div class="shell grid gap-8 py-8 lg:grid-cols-[1fr_340px]">' +
      '<div class="min-w-0 space-y-6">' +
        '<div class="card overflow-hidden">' + cover(d.thumbnail_url, d.category_name, 'aspect-[21/9]') +
          '<div class="p-6">' +
            (d.category_name ? '<span class="badge-cat">' + fmt.esc(d.category_name) + '</span>' : '') +
            '<h1 class="mt-2 text-2xl sm:text-3xl">' + fmt.esc(d.title) + '</h1>' +
            (d.subtitle ? '<p class="prose-brand mt-2">' + fmt.esc(d.subtitle) + '</p>' : '') +
            '<div class="mt-4 flex flex-wrap gap-2">' +
              fact(plural(d.question_count || 0, 'question')) +
              (tree() ? fact(plural(d.chapter_count || d.chapters.length, 'chapter')) + fact(plural(d.quiz_count || allQuizzes().length, 'quiz', 'quizzes'))
                : (d.section_count ? fact(plural(d.section_count, 'section')) : '') + fact(d.time_limit_minutes ? '⏱ ' + timeLimit(d.time_limit_minutes) : 'No time limit')) +
              fact('Pass ' + d.pass_percent + '%') +
              fact(Number(d.negative_mark) > 0 ? '−' + num(d.negative_mark) + ' per wrong' : 'No negative marking') +
              (d.buyers_count ? fact(d.buyers_count + ' enrolled') : '') +
            '</div>' +
            (d.related ? '<a class="mt-4 inline-flex items-center gap-2 rounded-lg bg-chip px-3 py-2 text-sm font-semibold text-primary hover:underline" href="' + (d.related.type === 'book' ? 'book' : 'course') + '.html?id=' + encodeURIComponent(d.related.id) + '">' +
              (d.related.type === 'book' ? '📘 Revises the book: ' : '🎬 Revises the video course: ') + fmt.esc(d.related.title) + ' →</a>' : '') +
          '</div></div>' +
        (tree() ? chaptersBlock() : '') +
        block('What you get', '<ul class="space-y-2.5 text-[15px] text-ink">' +
          (d.highlights || []).map(check).join('') +
          check('Detailed answer and explanation for every question') +
          check('Section-wise and topic-wise score analysis') +
          check('AI review of what you missed and what to revise') +
          check('Your full result e-mailed to you') +
          check(tree() ? 'Quizzes chapter by chapter; retake each as often as you like for 12 months' : 'Unlimited attempts for 12 months; progress is saved') + '</ul>') +
        (d.description ? block('About this quiz', '<p class="prose-brand whitespace-pre-line">' + fmt.esc(d.description) + '</p>') : '') +
        (!tree() && inside ? block("What's inside", '<ul class="divide-y divide-line">' + inside + '</ul>') : '') +
        ((d.topics || []).length ? block('Topics covered', '<div class="flex flex-wrap gap-2">' + d.topics.map((t) => '<span class="rounded-md bg-chip px-2.5 py-1 text-sm text-navy">' + fmt.esc(t) + '</span>').join('') + '</div>') : '') +
        (!owned && (d.sample_questions || []).length ? block('Sample questions', '<div class="space-y-3">' + d.sample_questions.map(sample).join('') + '</div>', 'Answers and explanations are shown after you finish the test.') : '') +
        block('How it works', '<p class="prose-brand whitespace-pre-line">' + fmt.esc(tree() ?
          (d.instructions || 'The course is split into chapters, and each chapter has its own quizzes. Pick any quiz and answer in any order; flag questions to revisit and your answers save automatically. Some quizzes have a time limit: the timer starts when you begin and your saved answers are submitted when it reaches zero. After each quiz you get your score, every answer with its explanation, a topic-wise analysis and an optional AI review. Retake any quiz as often as you like.') :
          (d.time_limit_minutes ? 'You have ' + timeLimit(d.time_limit_minutes) + ' from the moment you start. The timer keeps running if you leave, and when it reaches zero your saved answers are submitted automatically.\n\n' : '') +
          (d.instructions || (d.time_limit_minutes
            ? 'Answer the questions in any order and flag any to revisit. Your answers save automatically. When you submit, you get your score, every correct answer with its explanation, a section-wise analysis and an optional AI review.'
            : 'Answer the questions in any order. Your answers save automatically, so you can leave and come back. Flag questions to revisit them. When you submit, you get your score, every correct answer with its explanation, a section-wise analysis and an optional AI review.'))) + '</p>') +
      '</div>' +
      '<aside data-side>' + sidebar() + '</aside>' +
    '</div>';
  wire();
}

function wire() {
  const start = $('[data-start]');
  if (start) start.addEventListener('click', startQuiz);
  const buy = $('[data-buy]');
  if (buy) buy.addEventListener('click', checkout);
  const share = $('[data-share]');
  if (share) share.addEventListener('click', shareQuiz);
  const hist = $('[data-history]');
  if (hist) hist.addEventListener('click', showHistory);
  document.querySelectorAll('[data-test]').forEach((b) => b.addEventListener('click', () => startTest(b.dataset.test, b)));
  document.querySelectorAll('[data-locked]').forEach((b) => b.addEventListener('click', () => {
    if (!session.isLoggedIn) { location.href = 'login.html?next=' + encodeURIComponent('quiz.html?id=' + id); return; }
    toast('Buy the course to unlock this quiz.', 'info');
    const buy = $('[data-buy]'); if (buy) buy.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }));
  document.querySelectorAll('[data-results]').forEach((b) => b.addEventListener('click', () => showTestHistory(b.dataset.results)));
}

async function startTest(testId, b) {
  if (busy) return;
  if (!session.isLoggedIn) { location.href = 'login.html?next=' + encodeURIComponent('quiz.html?id=' + id); return; }
  const q = allQuizzes().find((x) => x.id === testId);
  if (!q) return;
  if (!q.in_progress && q.time_limit_minutes && !confirm('"' + q.title + '" has a ' + timeLimit(q.time_limit_minutes) + ' time limit. The timer starts now and keeps running if you leave. Start?')) return;
  busy = true;
  b.disabled = true; b.textContent = 'Starting…';
  try {
    const s = await api.quizTestStart(testId, session.userId);
    location.href = 'quiz-play.html?attempt=' + encodeURIComponent(s.attempt.id);
  } catch (e) {
    busy = false; render();
    toast(e.message || 'Could not start the quiz.', 'error');
  }
}

async function showTestHistory(testId) {
  const box = document.querySelector('[data-results-list="' + testId + '"]');
  if (box.innerHTML) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="sk mt-2 h-14"></div>';
  try {
    const r = await api.quizTestAttempts(testId, session.userId);
    const done = (r.items || []).filter((a) => a.status === 'submitted');
    box.innerHTML = done.length ? '<ul class="mt-2 rounded-lg bg-canvas px-3 text-sm">' + done.map((a, i) =>
      '<li><a class="flex items-center justify-between py-2 hover:text-primary" href="quiz-result.html?attempt=' + encodeURIComponent(a.id) + '">' +
      '<span>Attempt ' + (done.length - i) + ' · ' + fmt.date(a.submitted_at) + '</span><span class="font-bold ' + (a.passed ? 'text-ok' : 'text-bad') + '">' + pct(a.percent) + '</span></a></li>').join('') + '</ul>'
      : '<p class="mt-2 text-sm text-ink-muted">No finished attempts yet.</p>';
  } catch (e) { box.innerHTML = '<p class="mt-2 text-sm text-bad">' + fmt.esc(e.message) + '</p>'; }
}

/* infumedz.shop links open the app when it is installed, and fall back to
   this page on the website otherwise. */
async function shareQuiz() {
  const url = 'https://infumedz.shop/quiz/' + encodeURIComponent(id);
  const text = 'Practise this MCQ quiz on InfuMedz: ' + d.title;
  if (navigator.share) {
    try { await navigator.share({ title: d.title, text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text + ' ' + url); toast('Link copied. Paste it anywhere to share.', 'success'); }
  catch (_) { prompt('Copy this link:', url); }
}

async function showHistory() {
  const box = $('[data-history-list]');
  box.innerHTML = '<div class="sk mt-3 h-20"></div>';
  try {
    const r = await api.quizAttempts(id, session.userId);
    const done = (r.items || []).filter((a) => a.status === 'submitted');
    box.innerHTML = '<ul class="mt-3 divide-y divide-line text-sm">' + done.map((a, i) =>
      '<li><a class="flex items-center justify-between py-2 hover:text-primary" href="quiz-result.html?attempt=' + encodeURIComponent(a.id) + '">' +
      '<span>#' + (done.length - i) + ' · ' + fmt.date(a.submitted_at) + '</span><span class="font-bold ' + (a.passed ? 'text-ok' : 'text-bad') + '">' + pct(a.percent) + '</span></a></li>').join('') + '</ul>';
  } catch (e) { box.innerHTML = '<p class="mt-2 text-sm text-bad">' + fmt.esc(e.message) + '</p>'; }
}

async function startQuiz() {
  if (busy) return;
  const fresh = !(d.progress && d.progress.in_progress);
  if (fresh && d.time_limit_minutes && !confirm('This quiz has a ' + timeLimit(d.time_limit_minutes) + ' time limit. The timer starts now and keeps running if you leave. Start?')) return;
  busy = true;
  const b = $('[data-start]');
  b.disabled = true; b.textContent = 'Starting…';
  try {
    const s = await api.quizStart(id, session.userId);
    location.href = 'quiz-play.html?attempt=' + encodeURIComponent(s.attempt.id);
  } catch (e) {
    busy = false; b.disabled = false; render();
    toast(e.message || 'Could not start the quiz.', 'error');
  }
}

async function checkout() {
  if (busy || !session.requireLogin()) return;
  busy = true;
  const b = $('[data-buy]');
  b.disabled = true; b.textContent = 'Starting…';
  const reset = () => { busy = false; render(); };
  let order;
  try {
    order = await api.createQuizOrder(session.userId, id);
  } catch (e) {
    reset();
    return toast((e instanceof ApiError && e.status >= 500) ? 'Payments are temporarily unavailable. Please try again shortly.' : (e.message || 'Could not start the payment.'), 'error');
  }
  if (order.free) { toast('Added to your library.', 'success'); return load(); }
  if (!window.Razorpay) { reset(); return toast('Payment library failed to load. Check your connection and retry.', 'error'); }
  const rzp = new window.Razorpay({
    key: order.key, amount: order.amount, currency: 'INR', name: 'InfuMedz',
    description: d.title, order_id: order.order_id, image: d.thumbnail_url || undefined,
    prefill: { name: (session.user && session.user.name) || '', email: (session.user && session.user.email) || '' },
    theme: { color: '#0E5FD8' },
    handler: async (res) => {
      try {
        await api.verifyPayment({ order_id: res.razorpay_order_id, payment_id: res.razorpay_payment_id, signature: res.razorpay_signature });
        toast('Payment confirmed. The quiz is unlocked for 12 months.', 'success');
      } catch (e) {
        toast('Payment taken but not yet confirmed. Contact support with order ' + res.razorpay_order_id + '.', 'error', 12000);
      }
      busy = false;
      load();
    },
    modal: { ondismiss: reset },
  });
  rzp.on('payment.failed', (r) => { toast((r.error && r.error.description) || 'Payment failed.', 'error'); reset(); });
  rzp.open();
}

async function load() {
  d = await api.quiz(id, session.userId);
  render();
}

load().catch((e) => {
  $('[data-main]').innerHTML = '<div class="shell py-16">' + emptyState('Quiz not available', e.message || 'This quiz could not be loaded.',
    '<a href="quizzes.html" class="btn-primary btn-sm">Browse quizzes</a>') + '</div>';
});
</script>
</body>
</html>
