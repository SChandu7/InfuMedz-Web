<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Cardiology MCQ — InfuMedz</title>
<meta name="description" content="One cardiology question a day from InfuMedz: answer it, see the explanation and how other doctors answered, and keep your streak going.">
<link rel="canonical" href="https://infusionmedz.com/mcq.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E5FD8'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='18' font-weight='900' fill='white' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">
</head>
<body class="bg-canvas">

<div data-header></div>

<section class="bg-navy">
  <div class="shell py-8 lg:py-10">
    <nav class="mb-3 flex items-center gap-2 text-xs text-white/60" aria-label="Breadcrumb">
      <a href="index.html" class="hover:text-white">Home</a><span aria-hidden="true">/</span>
      <span class="font-medium text-white/90">Daily MCQ</span>
    </nav>
    <h1 class="text-2xl font-black text-white sm:text-3xl">Daily Cardiology MCQ</h1>
    <p class="mt-2 max-w-2xl text-white/80">One question a day. One attempt. Then the answer, the explanation and how other doctors answered.</p>
  </div>
</section>

<main class="shell py-8">
  <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_320px] lg:items-start">
    <div data-main><div class="space-y-3"><div class="sk h-40"></div><div class="sk h-56"></div></div></div>
    <aside class="space-y-4 lg:sticky lg:top-20" data-side></aside>
  </div>
  <section class="mt-10 hidden" data-history-wrap>
    <h2 class="text-lg">Past questions</h2>
    <p class="mt-1 text-sm text-ink-muted">Every closed question with its answer and explanation — useful revision even for the days you missed.</p>
    <div class="mt-4 space-y-3" data-history></div>
  </section>
</main>

<div data-footer></div>

<script type="module">
import { api } from './assets/js/api.js';
import { session } from './assets/js/session.js';
import { boot, fmt, toast } from './assets/js/ui.js';

boot('mcq.html');
const $ = (s) => document.querySelector(s);
const esc = (s) => fmt.esc(s == null ? '' : String(s));
const uid = session.userId;

let today = null;          // last response from mcq/today
let offset = 0;            // server clock - browser clock, ms
let picked = new Set();
let typed = '';
let busy = false;

/* ── helpers ── */

function countdown(ms) {
  if (ms <= 0) return '0s';
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s / 3600) % 24, m = Math.floor(s / 60) % 60;
  if (s >= 86400) return d + 'd ' + h + 'h';
  if (s >= 3600) return Math.floor(s / 3600) + 'h ' + String(m).padStart(2, '0') + 'm';
  if (s >= 60) return m + 'm ' + String(s % 60).padStart(2, '0') + 's';
  return s + 's';
}
const left = (iso) => iso ? new Date(iso).getTime() - (Date.now() + offset) : null;
const typeLabel = (t) => t === 'multiple' ? 'Select all that apply' : t === 'text' ? 'Type your answer' : 'Choose one';

/* ── load ── */

async function load(silent) {
  try {
    today = await api.mcqToday(uid);
    offset = new Date(today.server_time).getTime() - Date.now();
    if (!today.question || (today.state === 'open' && today.question.id !== (load.lastId || null))) { picked = new Set(); typed = ''; }
    load.lastId = today.question && today.question.id;
    draw();
  } catch (e) {
    if (!silent) $('[data-main]').innerHTML = '<div class="card p-8 text-center"><p class="font-bold text-navy">Could not load today\'s question</p>' +
      '<p class="mt-1 text-sm text-ink-muted">' + esc(e.message) + '</p><button class="btn-primary btn-sm mt-4" data-retry>Try again</button></div>';
    const r = $('[data-retry]');
    if (r) r.addEventListener('click', () => load());
  }
}

/* ── main column ── */

function draw() {
  drawSide();
  const t = today;
  const main = $('[data-main]');
  if (!t.question) {
    main.innerHTML = '<div class="card p-10 text-center">' +
      '<p class="text-lg font-bold text-navy">No question right now</p>' +
      '<p class="mx-auto mt-2 max-w-md text-sm text-ink-soft">Today\'s question has closed. Turn on notifications and we\'ll tell you when the next one is up.</p></div>';
    return;
  }
  const q = t.question;
  const answered = t.state === 'answered';
  const a = t.answer, s = t.solution, crowd = t.crowd;

  let body = '<div class="card p-5 sm:p-6">' +
    '<div class="flex flex-wrap gap-2">' +
      '<span class="badge-cat">' + esc(q.topic || "Today's question") + '</span>' +
      '<span class="badge bg-canvas text-ink-soft">' + typeLabel(q.question_type) + '</span>' +
    '</div>' +
    '<p class="mt-4 whitespace-pre-line text-lg font-semibold leading-relaxed text-navy">' + esc(q.question) + '</p>' +
    (q.image_url ? '<a href="' + esc(q.image_url) + '" target="_blank" rel="noopener" class="mt-4 block overflow-hidden rounded-xl2 border border-line">' +
      '<img src="' + esc(q.image_url) + '" alt="Question image" class="max-h-[420px] w-full object-contain bg-white"></a>' +
      '<p class="mt-1 text-xs text-ink-muted">Click the image to open it full size.</p>' : '') +
    '<div class="mt-5 space-y-2">';

  if (q.question_type === 'text') {
    body += answered
      ? '<div class="rounded-xl2 bg-canvas p-4"><p class="text-xs text-ink-muted">Your answer</p><p class="font-semibold text-navy">' + esc(a.text_answer) + '</p>' +
        (s.accepted_answers.length ? '<p class="mt-2 text-xs text-ink-muted">Accepted answer' + (s.accepted_answers.length > 1 ? 's' : '') + '</p><p class="font-semibold text-ok">' + esc(s.accepted_answers.join(' · ')) + '</p>' : '') + '</div>'
      : '<textarea class="field" rows="2" maxlength="500" placeholder="Type your answer" data-text>' + esc(typed) + '</textarea>';
  } else {
    q.options.forEach((o) => {
      const sel = answered ? a.selected_options.includes(o.id) : picked.has(o.id);
      const correct = answered && s.correct_options.includes(o.id);
      const wrong = answered && sel && !correct;
      const share = answered && crowd && crowd.total ? (crowd.per_option[o.id] || 0) / crowd.total : null;
      const cls = correct ? 'border-ok bg-ok/5' : wrong ? 'border-bad bg-bad/5' : sel ? 'border-primary bg-chip' : 'border-line bg-white hover:border-primary/40';
      const mark = q.question_type === 'multiple'
        ? '<span class="grid h-5 w-5 shrink-0 place-items-center rounded-md border-2 ' + (correct ? 'border-ok bg-ok' : wrong ? 'border-bad bg-bad' : sel ? 'border-primary bg-primary' : 'border-line') + '">' +
            (sel || correct ? '<svg viewBox="0 0 20 20" class="h-3.5 w-3.5 text-white" fill="currentColor"><path d="M8 13.4 4.6 10l-1.2 1.2L8 15.8l9-9-1.2-1.2Z"/></svg>' : '') + '</span>'
        : '<span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border-2 ' + (correct ? 'border-ok' : wrong ? 'border-bad' : sel ? 'border-primary' : 'border-line') + '">' +
            (sel || correct ? '<span class="h-2.5 w-2.5 rounded-full ' + (correct ? 'bg-ok' : wrong ? 'bg-bad' : 'bg-primary') + '"></span>' : '') + '</span>';
      body += '<button type="button" class="block w-full rounded-xl2 border p-3.5 text-left transition ' + cls + '" data-opt="' + esc(o.id) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="flex items-start gap-3">' + mark +
          '<span class="flex-1 text-[15px] leading-relaxed text-ink">' + esc(o.text) + '</span>' +
          (share != null ? '<span class="text-sm font-bold text-ink-muted">' + Math.round(share * 100) + '%</span>' : '') +
        '</span>' +
        (share != null ? '<span class="mt-2 block h-1 overflow-hidden rounded-full bg-line"><span class="block h-full rounded-full ' + (correct ? 'bg-ok' : 'bg-ink-muted/40') + '" style="width:' + Math.round(share * 100) + '%"></span></span>' : '') +
      '</button>';
    });
  }
  body += '</div>';

  if (!answered) {
    const can = q.question_type === 'text' ? typed.trim().length > 0 : picked.size > 0;
    const closes = left(q.expires_at);
    body += '<div class="mt-5 flex flex-wrap items-center gap-3">' +
      (uid
        ? '<button class="btn-primary" data-submit' + (can && !busy ? '' : ' disabled') + '>' + (busy ? 'Submitting…' : 'Submit answer') + '</button>'
        : '<a class="btn-primary" href="login.html?next=mcq.html">Sign in to answer</a>') +
      '<span class="text-xs text-ink-muted" data-closes>One attempt' + (closes != null ? ' · closes in ' + countdown(closes) : '') + '</span>' +
    '</div>';
  }
  body += '</div>';

  if (answered) {
    const ok = a.is_correct;
    const [title, sub, tone] = ok === true ? ['Correct!', 'Well done — keep the streak going.', 'ok'] : ok === false ? ['Not quite', 'See the correct answer and explanation below.', 'bad'] : ['Answer recorded', 'Compare it with the explanation below.', 'primary'];
    body += '<div class="mt-4 rounded-xl2 border p-4 ' + (tone === 'ok' ? 'border-ok/40 bg-ok/5' : tone === 'bad' ? 'border-bad/40 bg-bad/5' : 'border-primary/30 bg-chip') + '">' +
      '<p class="text-lg font-black ' + (tone === 'ok' ? 'text-ok' : tone === 'bad' ? 'text-bad' : 'text-primary') + '">' + title + '</p>' +
      '<p class="text-sm text-ink-soft">' + sub + '</p>' +
      (crowd && crowd.percent_correct != null && crowd.total >= 3 ? '<p class="mt-1 text-sm text-ink-soft">' + crowd.percent_correct + '% of ' + crowd.total + ' doctors got this right.</p>' : '') +
    '</div>';
    if (s.explanation) {
      body += '<div class="card mt-4 p-5"><h2 class="text-base">Explanation</h2><p class="mt-2 whitespace-pre-line text-[15px] leading-relaxed text-ink">' + esc(s.explanation) + '</p></div>';
    }
    if (s.related) {
      const r = s.related;
      body += '<a class="card-hover mt-4 flex items-center gap-4 p-4" href="' + (r.type === 'book' ? 'book.html' : 'course.html') + '?id=' + encodeURIComponent(r.id) + '">' +
        (r.thumbnail_url ? '<img src="' + esc(r.thumbnail_url) + '" alt="" class="h-16 w-16 shrink-0 rounded-xl object-cover">' : '') +
        '<span class="min-w-0 flex-1"><span class="block text-xs font-bold text-primary">' + (r.type === 'book' ? 'Go deeper with this book' : 'Master this topic') + '</span>' +
        '<span class="block truncate font-bold text-navy">' + esc(r.title) + '</span></span>' +
        '<span class="text-primary">&rarr;</span></a>';
    }
  }
  main.innerHTML = body;
  wireMain();
}

function wireMain() {
  document.querySelectorAll('[data-opt]').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.opt;
    if (today.question.question_type === 'multiple') { picked.has(id) ? picked.delete(id) : picked.add(id); }
    else picked = new Set([id]);
    draw();
  }));
  const ta = $('[data-text]');
  if (ta) ta.addEventListener('input', () => {
    typed = ta.value;
    const btn = $('[data-submit]');
    if (btn) btn.disabled = !typed.trim() || busy;
  });
  const sub = $('[data-submit]');
  if (sub) sub.addEventListener('click', submit);
}

async function submit() {
  const q = today.question;
  busy = true; draw();
  try {
    const r = await api.mcqAnswer({
      user_id: uid, mcq_id: q.id,
      selected: q.question_type === 'text' ? [] : q.options.filter((o) => picked.has(o.id)).map((o) => o.id),
      text: q.question_type === 'text' ? typed.trim() : '',
    });
    today = Object.assign({}, today, r, { subscribed: today.subscribed });
    offset = new Date(r.server_time).getTime() - Date.now();
    loadHistory();
  } catch (e) {
    toast(e.message || 'Could not submit your answer.', 'error');
    if (e.status === 410) load(true);
  }
  busy = false; draw();
}

/* ── sidebar ── */

function nextInfo() {
  const t = today;
  const nextMs = left(t.next_at);
  if (t.state === 'open' && t.question) return ['Answer before it closes', t.question.expires_at ? 'Closes in ' + countdown(left(t.question.expires_at)) : ''];
  if (nextMs != null && nextMs > 0) return [t.state === 'answered' ? 'Come back for the next question' : 'Next question', 'In ' + countdown(nextMs)];
  return ['Next question', 'A new question will be posted soon.'];
}

function drawSide() {
  const t = today;
  const st = t.stats;
  const [nextTitle, nextText] = nextInfo();

  $('[data-side]').innerHTML =
    (uid ? '<div class="card grid grid-cols-3 divide-x divide-line text-center">' +
      [['' + (st ? st.streak : 0), 'Day streak'], ['' + (st ? st.answered : 0), 'Answered'], [st && st.accuracy != null ? st.accuracy + '%' : '–', 'Accuracy']]
        .map(([v, l]) => '<div class="py-4"><p class="text-xl font-black text-navy">' + v + '</p><p class="text-xs text-ink-muted">' + l + '</p></div>').join('') + '</div>' : '') +
    '<div class="rounded-xl2 bg-brand-grad p-5 text-white">' +
      '<p class="text-xs font-semibold text-white/75">' + nextTitle + '</p>' +
      '<p class="mt-1 text-xl font-black" data-next>' + esc(nextText) + '</p>' +
    '</div>' +
    (uid
      ? '<label class="card flex cursor-pointer items-start gap-3 p-4">' +
          '<input type="checkbox" class="mt-1 h-4 w-4 accent-[#0E5FD8]" data-notify' + (t.subscribed ? ' checked' : '') + '>' +
          '<span><span class="block text-sm font-semibold text-navy">Notify me about new questions</span>' +
          '<span class="block text-xs text-ink-muted">You get a notification in the InfuMedz app as soon as the next question is posted.</span></span>' +
        '</label>'
      : '<div class="card p-4 text-sm text-ink-soft"><a class="font-semibold text-primary hover:underline" href="login.html?next=mcq.html">Sign in</a> to answer, keep a streak and see past questions.</div>');

  const n = $('[data-notify]');
  if (n) n.addEventListener('change', async () => {
    n.disabled = true;
    try {
      const r = await api.mcqNotify({ user_id: uid, enabled: n.checked });
      today.subscribed = r.subscribed;
      toast(r.subscribed ? "You'll be notified when a new question is posted." : 'Daily MCQ notifications turned off.', 'success');
    } catch (e) { n.checked = !n.checked; toast(e.message || 'Could not update.', 'error'); }
    n.disabled = false;
  });
}

/* ── history ── */

async function loadHistory() {
  if (!uid) return;
  try {
    const h = await api.mcqHistory(uid);
    const wrap = $('[data-history-wrap]');
    wrap.classList.remove('hidden');
    $('[data-history]').innerHTML = h.items.length ? h.items.map((it) => {
      const q = it.question, a = it.answer, s = it.solution;
      const [label, cls] = !a ? ['Missed', 'bg-canvas text-ink-muted'] : a.is_correct === true ? ['Correct', 'bg-ok/10 text-ok'] : a.is_correct === false ? ['Wrong', 'bg-bad/10 text-bad'] : ['Answered', 'bg-chip text-primary'];
      const date = q.publish_at ? new Date(q.publish_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
      const correct = q.options.filter((o) => s.correct_options.includes(o.id)).map((o) => o.text);
      const yours = a ? q.options.filter((o) => a.selected_options.includes(o.id)).map((o) => o.text) : [];
      return '<details class="card p-4">' +
        '<summary class="cursor-pointer list-none">' +
          '<span class="flex flex-wrap items-center gap-2"><span class="badge ' + cls + '">' + label + '</span><span class="text-xs text-ink-muted">' + esc(date) + (q.topic ? ' · ' + esc(q.topic) : '') + '</span></span>' +
          '<span class="mt-1.5 block font-semibold text-navy">' + esc(q.question) + '</span>' +
        '</summary>' +
        '<div class="mt-3 space-y-1.5 border-t border-line pt-3 text-sm">' +
          (q.question_type === 'text'
            ? (a ? '<p><strong class="text-navy">Your answer:</strong> ' + esc(a.text_answer) + '</p>' : '') + (s.accepted_answers.length ? '<p><strong class="text-navy">Accepted:</strong> ' + esc(s.accepted_answers.join(' · ')) + '</p>' : '')
            : (yours.length ? '<p><strong class="text-navy">Your answer:</strong> ' + esc(yours.join(' · ')) + '</p>' : '') + (correct.length ? '<p><strong class="text-navy">Correct answer:</strong> ' + esc(correct.join(' · ')) + '</p>' : '')) +
          (s.explanation ? '<p class="whitespace-pre-line leading-relaxed text-ink-soft">' + esc(s.explanation) + '</p>' : '') +
        '</div></details>';
    }).join('') : '<p class="text-sm text-ink-muted">Questions appear here after they close, with their answers.</p>';
  } catch (_) { /* history is optional */ }
}

/* ── live countdowns ── */

let reloading = false;
setInterval(() => {
  if (!today) return;
  const target = today.state === 'open' && today.question ? today.question.expires_at : today.next_at;
  const ms = left(target);
  if (ms != null && ms <= 0 && !reloading) {
    reloading = true;
    setTimeout(() => load(true).finally(() => { reloading = false; }), 1500);
    return;
  }
  // Only the countdown texts change each second; the rest stays put so a
  // click on the notification checkbox is never interrupted.
  const nx = $('[data-next]');
  if (nx) nx.textContent = nextInfo()[1];
  const c = $('[data-closes]');
  if (c && today.question && today.question.expires_at) c.textContent = 'One attempt · closes in ' + countdown(left(today.question.expires_at));
}, 1000);

document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });

load();
loadHistory();
</script>
</body>
</html>
