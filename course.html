<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-title>Course — InfuMedz</title>
<meta name="description" data-desc content="Video lecture course on InfuMedz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E5FD8'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='18' font-weight='900' fill='white' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">
<script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
</head>
<body>

<div data-header></div>
<main data-main>
  <div class="shell py-16">
    <div class="sk h-6 w-48"></div>
    <div class="sk mt-4 h-10 w-2/3"></div>
    <div class="sk mt-8 aspect-video w-full"></div>
  </div>
</main>
<div data-footer></div>

<script type="module">
import { api, ApiError } from './assets/js/api.js';
import { session } from './assets/js/session.js';
import { boot, fmt, stars, toast, emptyState } from './assets/js/ui.js';

boot('courses.html');

const $  = (s, r) => (r || document).querySelector(s);
const id = new URLSearchParams(location.search).get('id');

if (!id) {
  $('[data-main]').innerHTML = '<div class="shell py-16">' +
    emptyState('No course selected', 'That link is missing a course id.',
      '<a href="courses.html" class="btn-primary btn-sm">Browse courses</a>') + '</div>';
  throw new Error('missing id');
}

let course = null;
let hasAccess = false;
let reviewData = { average_rating: 0, total_reviews: 0, reviews: [] };

/* ── lecture list ──────────────────────────────────────── */

// Matches the app exactly - lib/features/course_detail/course_detail_screen.dart:525
//     final isItemLocked = flatIndex >= 2 && _isLocked;
// The first two items in flat order are a free preview for everyone; the
// rest open only once check-access/ confirms the purchase.
const FREE_PREVIEW = 2;

function lectureRow(v, n, restricted) {
  const locked = restricted && n > FREE_PREVIEW;
  const free = !locked && restricted;
  const icon = locked
    ? '<svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 1a4 4 0 0 0-4 4v2H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-1V5a4 4 0 0 0-4-4Zm2 6V5a2 2 0 1 0-4 0v2h4Z" clip-rule="evenodd"/></svg>'
    : '<svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6.3 3.8A1 1 0 0 0 4.8 4.7v10.6a1 1 0 0 0 1.5.9l8.4-5.3a1 1 0 0 0 0-1.7L6.3 3.8Z"/></svg>';

  return '' +
    '<button class="group flex w-full items-center gap-3 border-b border-line px-4 py-3 text-left last:border-0 ' +
            (locked ? 'cursor-not-allowed' : 'hover:bg-chip') + '" ' +
            (locked ? 'disabled aria-disabled="true"' : 'data-play="' + fmt.esc(v.video_url) + '" data-vtitle="' + fmt.esc(v.title) + '"') + '>' +
      '<span class="grid h-8 w-8 shrink-0 place-items-center rounded-full ' +
            (locked ? 'bg-line text-ink-muted' : 'bg-chip text-primary group-hover:bg-primary group-hover:text-white') + ' transition-colors">' +
        icon + '</span>' +
      '<span class="min-w-0 flex-1">' +
        '<span class="block truncate text-sm font-medium ' + (locked ? 'text-ink-muted' : 'text-navy') + '">' +
          n + '. ' + fmt.esc(v.title) + '</span>' +
      '</span>' +
      (locked ? '<span class="shrink-0 text-xs text-ink-muted">Locked</span>' : '') +
      (free ? '<span class="badge-free shrink-0">Free preview</span>' : '') +
    '</button>';
}

function lectureList() {
  const videos = (course.videos || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  if (!videos.length) {
    return '<p class="px-4 py-8 text-center text-sm text-ink-muted">Lectures are being added to this course.</p>';
  }

  const chapters = (course.chapters || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  let n = 0;

  // Grouped by chapter when chapters exist, flat otherwise. The app does the
  // same; videos with chapter === null fall into "Other lectures".
  if (chapters.length) {
    let out = '';
    chapters.forEach((ch) => {
      const mine = videos.filter((v) => String(v.chapter) === String(ch.id));
      if (!mine.length) return;
      out += '<div class="border-b border-line bg-canvas px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-navy">' +
             fmt.esc(ch.title) + '</div>';
      mine.forEach((v) => { out += lectureRow(v, ++n, !hasAccess); });
    });
    const loose = videos.filter((v) => !v.chapter);
    if (loose.length) {
      out += '<div class="border-b border-line bg-canvas px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-navy">Other lectures</div>';
      loose.forEach((v) => { out += lectureRow(v, ++n, !hasAccess); });
    }
    return out;
  }
  return videos.map((v) => lectureRow(v, ++n, !hasAccess)).join('');
}

/* ── reviews ───────────────────────────────────────────── */

function reviewsBlock() {
  const avg = Number(reviewData.average_rating) || 0;
  const list = reviewData.reviews || [];

  // Play-Store style 5→1 breakdown, bucketed client-side from the list.
  const buckets = [0, 0, 0, 0, 0];
  list.forEach((r) => { const i = Math.round(r.rating); if (i >= 1 && i <= 5) buckets[i - 1]++; });
  const max = Math.max(1, ...buckets);

  let bars = '';
  for (let s = 5; s >= 1; s--) {
    const c = buckets[s - 1];
    bars += '<div class="flex items-center gap-2">' +
              '<span class="w-3 text-xs text-ink-muted">' + s + '</span>' +
              '<div class="h-1.5 flex-1 overflow-hidden rounded-full bg-line">' +
                '<div class="h-full rounded-full bg-warn" style="width:' + ((c / max) * 100) + '%"></div>' +
              '</div>' +
              '<span class="w-6 text-right text-xs text-ink-muted">' + c + '</span>' +
            '</div>';
  }

  const cards = list.length
    ? list.map((r) =>
        '<article class="border-b border-line py-5 last:border-0">' +
          '<div class="flex items-start gap-3">' +
            '<span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-brand-grad text-xs font-bold text-white">' +
              fmt.esc(fmt.initials(r.user_name)) + '</span>' +
            '<div class="min-w-0 flex-1">' +
              '<div class="flex flex-wrap items-center gap-x-2.5 gap-y-1">' +
                '<span class="text-sm font-semibold text-navy">' + fmt.esc(r.user_name) + '</span>' +
                stars(r.rating, 'h-3.5 w-3.5') +
                '<span class="text-xs text-ink-muted">' + fmt.ago(r.created_at) + '</span>' +
              '</div>' +
              (r.comment ? '<p class="prose-brand mt-1.5 text-sm">' + fmt.esc(r.comment) + '</p>' : '') +
              (r.admin_reply
                ? '<div class="mt-3 rounded-xl2 border border-line bg-canvas p-3">' +
                    '<div class="flex items-center gap-2">' +
                      '<span class="grid h-5 w-5 place-items-center rounded-full bg-primary text-[9px] font-bold text-white">I</span>' +
                      '<span class="text-xs font-bold text-primary">InfuMedz</span>' +
                      '<span class="text-xs text-ink-muted">' + fmt.ago(r.admin_reply_at) + '</span>' +
                    '</div>' +
                    '<p class="prose-brand mt-1.5 text-sm">' + fmt.esc(r.admin_reply) + '</p>' +
                  '</div>'
                : '') +
            '</div>' +
          '</div>' +
        '</article>')
      .join('')
    : '<p class="py-8 text-center text-sm text-ink-muted">No reviews yet. Be the first once you enrol.</p>';

  const composer = (hasAccess && session.isLoggedIn)
    ? '<div class="card mt-6 p-5">' +
        '<h4 class="text-sm">Write a review</h4>' +
        '<div class="mt-3 flex items-center gap-1" data-rate role="radiogroup" aria-label="Your rating">' +
          [1,2,3,4,5].map((i) =>
            '<button type="button" data-star="' + i + '" role="radio" aria-checked="false" aria-label="' + i + ' star' + (i>1?'s':'') + '" ' +
                    'class="p-0.5 text-line transition-colors hover:text-warn">' +
              '<svg class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L10 14.9 4.8 17.6l1-5.8L1.5 7.7l5.9-.9L10 1.5z"/></svg>' +
            '</button>').join('') +
        '</div>' +
        '<textarea class="field mt-3" rows="3" placeholder="What did you think of this course?" data-comment></textarea>' +
        '<button class="btn-primary btn-sm mt-3" data-submit-review>Post review</button>' +
      '</div>'
    : '';

  return '' +
    '<section class="card p-6" id="reviews">' +
      '<h3 class="text-lg">Ratings &amp; reviews</h3>' +
      '<div class="mt-4 grid gap-6 sm:grid-cols-[auto_1fr] sm:gap-10">' +
        '<div class="text-center sm:text-left">' +
          '<p class="text-5xl font-black leading-none text-navy">' + avg.toFixed(1) + '</p>' +
          '<div class="mt-2 flex justify-center sm:justify-start">' + stars(avg) + '</div>' +
          '<p class="mt-1 text-xs text-ink-muted">' + (reviewData.total_reviews || 0) +
            ((reviewData.total_reviews === 1) ? ' review' : ' reviews') + '</p>' +
        '</div>' +
        '<div class="space-y-1.5">' + bars + '</div>' +
      '</div>' +
      '<div class="mt-6 border-t border-line">' + cards + '</div>' +
      composer +
    '</section>';
}

/* ── page render ───────────────────────────────────────── */

function render() {
  const videos = course.videos || [];
  const price = Number(course.price) || 0;

  document.querySelector('[data-title]').textContent = course.title + ' — InfuMedz';
  document.querySelector('[data-desc]').setAttribute('content', String(course.description || '').slice(0, 155));

  const cta = hasAccess
    ? '<div class="badge-own w-full justify-center py-2.5 text-sm">You own this course</div>'
    : '<button class="btn-primary btn-lg w-full" data-buy>' +
        (price === 0 ? 'Get free access' : 'Buy for ' + fmt.price(price)) +
      '</button>';

  $('[data-main]').innerHTML = '' +
    // ── hero ──
    '<section class="border-b border-line bg-white">' +
      '<div class="shell py-8 lg:py-10">' +
        '<nav class="mb-4 flex items-center gap-2 text-xs text-ink-muted" aria-label="Breadcrumb">' +
          '<a href="index.html" class="hover:text-primary">Home</a><span aria-hidden="true">/</span>' +
          '<a href="courses.html" class="hover:text-primary">Courses</a><span aria-hidden="true">/</span>' +
          '<span class="truncate font-medium text-navy">' + fmt.esc(course.title) + '</span>' +
        '</nav>' +
        '<div class="grid gap-8 lg:grid-cols-[1fr_340px]">' +
          '<div>' +
            '<div class="mb-3 flex flex-wrap items-center gap-2">' +
              (course.category_name ? '<span class="badge-cat">' + fmt.esc(course.category_name) + '</span>' : '') +
              '<span class="text-xs text-ink-muted">' + videos.length + (videos.length === 1 ? ' lecture' : ' lectures') + '</span>' +
              (course.buyers_count ? '<span class="text-xs text-ink-muted">&middot; ' + course.buyers_count + ' enrolled</span>' : '') +
            '</div>' +
            '<h1 class="text-2xl sm:text-3xl lg:text-4xl">' + fmt.esc(course.title) + '</h1>' +
            '<p class="prose-brand mt-3 max-w-2xl">' + fmt.esc(course.description) + '</p>' +
            '<div class="mt-4 flex items-center gap-2">' +
              stars(reviewData.average_rating) +
              '<a href="#reviews" class="text-sm text-ink-muted hover:text-primary">' +
                (Number(reviewData.average_rating) || 0).toFixed(1) + ' (' + (reviewData.total_reviews || 0) + ')</a>' +
            '</div>' +
          '</div>' +
          // purchase card
          '<aside class="lg:sticky lg:top-24 lg:self-start">' +
            '<div class="card overflow-hidden">' +
              '<div class="aspect-video bg-chip">' +
                '<img src="' + fmt.esc(course.thumbnail_url || '') + '" alt="" class="h-full w-full object-cover">' +
              '</div>' +
              '<div class="p-5">' +
                (hasAccess ? '' : '<p class="mb-3 text-3xl font-black text-navy">' + fmt.price(price) + '</p>') +
                cta +
                '<ul class="mt-4 space-y-2 text-sm text-ink-soft">' +
                  '<li class="flex gap-2"><span class="text-ok">&check;</span> Lifetime access</li>' +
                  '<li class="flex gap-2"><span class="text-ok">&check;</span> Watch on web and mobile app</li>' +
                  '<li class="flex gap-2"><span class="text-ok">&check;</span> Organised by chapter</li>' +
                '</ul>' +
              '</div>' +
            '</div>' +
          '</aside>' +
        '</div>' +
      '</div>' +
    '</section>' +

    // ── body ──
    '<section class="section">' +
      '<div class="shell grid gap-8 lg:grid-cols-[1fr_340px]">' +
        '<div class="space-y-6">' +
          '<div data-player-slot></div>' +
          '<div class="card overflow-hidden">' +
            '<div class="border-b border-line px-4 py-3">' +
              '<h2 class="text-base">Course content</h2>' +
              '<p class="text-xs text-ink-muted">' + videos.length + ' lectures' +
                (hasAccess ? '' : ' &middot; first ' + FREE_PREVIEW + ' free to watch') + '</p>' +
            '</div>' +
            lectureList() +
          '</div>' +
          reviewsBlock() +
        '</div>' +
        '<div></div>' +
      '</div>' +
    '</section>';

  wire();
}

/* ── interactions ──────────────────────────────────────── */

function wire() {
  // Play a lecture inline.
  document.querySelectorAll('[data-play]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const url = btn.dataset.play;
      const title = btn.dataset.vtitle;
      const slot = $('[data-player-slot]');
      slot.innerHTML =
        '<div class="card overflow-hidden">' +
          '<video class="aspect-video w-full bg-black" controls autoplay playsinline controlsList="nodownload" ' +
                 'src="' + fmt.esc(url) + '"></video>' +
          '<div class="px-4 py-3"><p class="text-sm font-semibold text-navy">' + fmt.esc(title) + '</p></div>' +
        '</div>';
      slot.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  // Buy.
  const buy = $('[data-buy]');
  if (buy) buy.addEventListener('click', startCheckout);

  // Review composer.
  let rating = 0;
  const rateBox = $('[data-rate]');
  if (rateBox) {
    rateBox.addEventListener('click', (e) => {
      const b = e.target.closest('[data-star]');
      if (!b) return;
      rating = Number(b.dataset.star);
      Array.from(rateBox.querySelectorAll('[data-star]')).forEach((s) => {
        const on = Number(s.dataset.star) <= rating;
        s.className = 'p-0.5 transition-colors ' + (on ? 'text-warn' : 'text-line hover:text-warn');
        s.setAttribute('aria-checked', String(Number(s.dataset.star) === rating));
      });
    });
  }

  const submit = $('[data-submit-review]');
  if (submit) {
    submit.addEventListener('click', async () => {
      if (!rating) return toast('Pick a star rating first.', 'warn');
      submit.disabled = true;
      try {
        await api.addCourseReview({
          user: session.userId,
          course_id: course.id,
          rating,
          comment: ($('[data-comment]').value || '').trim(),
        });
        toast('Thanks — your review is posted.', 'success');
        reviewData = await api.courseReviews(id);
        render();
      } catch (e) {
        toast(e.message || 'Could not post your review.', 'error');
        submit.disabled = false;
      }
    });
  }
}

/* ── Razorpay checkout ─────────────────────────────────── */

async function startCheckout() {
  if (!session.requireLogin()) return;

  const btn = $('[data-buy]');
  btn.disabled = true;
  btn.textContent = 'Starting…';

  let order;
  try {
    order = await api.createCourseOrder(session.userId, course.id);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Buy for ' + fmt.price(course.price);
    // A 500 here currently means the backend's Razorpay credentials are
    // rejected. Say something a customer can act on rather than "500".
    const msg = (e instanceof ApiError && e.status >= 500)
      ? 'Payments are temporarily unavailable. Please try again shortly or contact support.'
      : (e.message || 'Could not start the payment.');
    return toast(msg, 'error');
  }

  if (!window.Razorpay) {
    btn.disabled = false;
    btn.textContent = 'Buy for ' + fmt.price(course.price);
    return toast('Payment library failed to load. Check your connection and retry.', 'error');
  }

  const rzp = new window.Razorpay({
    key: order.key,
    amount: order.amount,
    currency: 'INR',
    name: 'InfuMedz',
    description: course.title,
    order_id: order.order_id,
    image: course.thumbnail_url || undefined,
    prefill: {
      name: (session.user && session.user.name) || '',
      email: (session.user && session.user.email) || '',
    },
    theme: { color: '#0E5FD8' },
    handler: async (res) => {
      try {
        await api.verifyPayment({
          order_id: res.razorpay_order_id,
          payment_id: res.razorpay_payment_id,
          signature: res.razorpay_signature,
        });
        toast('Payment confirmed — the course is now in your library.', 'success');
        hasAccess = true;
        render();
      } catch (e) {
        // Verification failing after money moved is the one case that must
        // never be silently swallowed - the app v1 bug was exactly this.
        toast('Payment taken but not yet confirmed. Contact support with order ' +
              res.razorpay_order_id + '.', 'error', 12000);
      }
    },
    modal: {
      ondismiss: () => {
        btn.disabled = false;
        btn.textContent = 'Buy for ' + fmt.price(course.price);
      },
    },
  });

  rzp.on('payment.failed', (r) => {
    toast((r.error && r.error.description) || 'Payment failed.', 'error');
    btn.disabled = false;
    btn.textContent = 'Buy for ' + fmt.price(course.price);
  });

  rzp.open();
}

/* ── load ──────────────────────────────────────────────── */

async function load() {
  const [c, rev] = await Promise.all([
    api.course(id),
    api.courseReviews(id).catch(() => reviewData),
  ]);
  course = c;
  reviewData = rev || reviewData;

  if (session.isLoggedIn) {
    try {
      const r = await api.checkAccess(session.userId, 'course', id);
      hasAccess = !!(r && r.has_access);
    } catch (_) { hasAccess = false; }
  }
  if (Number(course.price) === 0) hasAccess = true;

  render();
}

load().catch((e) => {
  $('[data-main]').innerHTML = '<div class="shell py-16">' +
    emptyState('Course not available', e.message || 'This course could not be loaded.',
      '<a href="courses.html" class="btn-primary btn-sm">Browse all courses</a>') + '</div>';
});
</script>
</body>
</html>
