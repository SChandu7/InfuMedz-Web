<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Books &amp; Notes — InfuMedz</title>
<meta name="description" content="Concise reference notes and question banks for DM, DrNB, MD/MS and MBBS — adult cardiology, interventional cardiology, congenital heart disease and echocardiography.">
<link rel="canonical" href="https://infusionmedz.com/books.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E5FD8'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='18' font-weight='900' fill='white' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">
</head>
<body>

<div data-header></div>

<!-- ── Page head ────────────────────────────────────────── -->
<section class="border-b border-line bg-white">
  <div class="shell py-10">
    <nav class="mb-3 flex items-center gap-2 text-xs text-ink-muted" aria-label="Breadcrumb">
      <a href="index.html" class="hover:text-primary">Home</a>
      <span aria-hidden="true">/</span>
      <span class="font-medium text-navy">Books</span>
    </nav>
    <h1 class="text-3xl sm:text-4xl">Books &amp; Notes</h1>
    <p class="prose-brand mt-2 max-w-2xl">
      Concise notes and question banks, organised by chapter. Buy once, read on the web
      or in the mobile app, forever.
    </p>
  </div>
</section>

<!-- ── Catalogue ────────────────────────────────────────── -->
<section class="section">
  <div class="shell grid gap-8 lg:grid-cols-[232px_1fr]">

    <!-- Filter rail -->
    <aside class="lg:sticky lg:top-24 lg:self-start">
      <div class="card p-5">
        <h2 class="mb-3 text-sm font-bold uppercase tracking-wider text-navy">Speciality</h2>
        <div class="space-y-1" data-cats role="group" aria-label="Filter by speciality">
          <div class="sk h-8"></div><div class="sk h-8"></div><div class="sk h-8"></div>
        </div>

        <h2 class="mb-3 mt-6 text-sm font-bold uppercase tracking-wider text-navy">Price</h2>
        <div class="space-y-1" data-price role="group" aria-label="Filter by price">
          <button class="w-full rounded-lg px-3 py-1.5 text-left text-sm text-ink-soft hover:bg-chip hover:text-primary" data-p="all">All prices</button>
          <button class="w-full rounded-lg px-3 py-1.5 text-left text-sm text-ink-soft hover:bg-chip hover:text-primary" data-p="lt2000">Under &#8377;2,000</button>
          <button class="w-full rounded-lg px-3 py-1.5 text-left text-sm text-ink-soft hover:bg-chip hover:text-primary" data-p="2000-6000">&#8377;2,000 &ndash; &#8377;6,000</button>
          <button class="w-full rounded-lg px-3 py-1.5 text-left text-sm text-ink-soft hover:bg-chip hover:text-primary" data-p="gt6000">Over &#8377;6,000</button>
        </div>

        <button class="btn-ghost btn-sm mt-6 w-full" data-reset>Clear filters</button>
      </div>
    </aside>

    <!-- Results -->
    <div>
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div class="relative min-w-[240px] flex-1">
          <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-ink-muted"
               viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 3.4 9.8l3.4 3.4 1.4-1.4-3.4-3.4A5.5 5.5 0 0 0 9 3.5Zm-3.5 5.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0Z" clip-rule="evenodd"/>
          </svg>
          <input type="search" class="field pl-10" placeholder="Search books…" data-search aria-label="Search books">
        </div>
        <div class="flex items-center gap-2">
          <label for="sort" class="text-sm text-ink-muted">Sort</label>
          <select id="sort" class="field w-auto py-2" data-sort>
            <option value="popular">Most enrolled</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="title">Title A–Z</option>
          </select>
        </div>
      </div>

      <p class="mb-4 text-sm text-ink-muted" data-count aria-live="polite"></p>
      <div class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3" data-grid></div>
    </div>

  </div>
</section>

<div data-footer></div>

<script type="module">
import { api } from './assets/js/api.js';
import { session } from './assets/js/session.js';
import { boot, itemCard, skeletonGrid, emptyState, fmt, toast } from './assets/js/ui.js';

boot('books.html');
const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

$('[data-grid]').innerHTML = skeletonGrid(6);

let all = [];
let owned = new Set();
const state = {
  category: new URLSearchParams(location.search).get('category') || 'all',
  price: 'all',
  q: '',
  sort: 'popular',
};

/* ── filtering ─────────────────────────────────────────── */

const inPriceBand = (p, band) => {
  const n = Number(p) || 0;
  if (band === 'lt2000') return n < 2000;
  if (band === '2000-6000') return n >= 2000 && n <= 6000;
  if (band === 'gt6000') return n > 6000;
  return true;
};

function apply() {
  const q = state.q.trim().toLowerCase();

  let rows = all.filter((c) => {
    if (state.category !== 'all' && c.category_name !== state.category) return false;
    if (!inPriceBand(c.price, state.price)) return false;
    if (q) {
      const hay = ((c.title || '') + ' ' + (c.description || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const sorters = {
    popular:      (a, b) => (b.buyers_count || 0) - (a.buyers_count || 0),
    'price-asc':  (a, b) => Number(a.price) - Number(b.price),
    'price-desc': (a, b) => Number(b.price) - Number(a.price),
    title:        (a, b) => String(a.title).localeCompare(String(b.title)),
  };
  rows.sort(sorters[state.sort] || sorters.popular);

  $('[data-count]').textContent =
    rows.length + (rows.length === 1 ? ' book' : ' books') +
    (state.category !== 'all' ? ' in ' + state.category : '');

  $('[data-grid]').innerHTML = rows.length
    ? rows.map((b) => itemCard(b, 'book', { owned: owned.has(String(b.id)) })).join('')
    : emptyState(
        'No books match',
        'Try clearing a filter or searching for something broader.',
        '<button class="btn-primary btn-sm" onclick="document.querySelector(\'[data-reset]\').click()">Clear filters</button>'
      );

  paintActive();
}

function paintActive() {
  $$('[data-cats] [data-c]').forEach((b) => {
    const on = b.dataset.c === state.category;
    b.className = 'w-full rounded-lg px-3 py-1.5 text-left text-sm transition-colors ' +
      (on ? 'bg-chip font-semibold text-primary' : 'text-ink-soft hover:bg-chip hover:text-primary');
  });
  $$('[data-price] [data-p]').forEach((b) => {
    const on = b.dataset.p === state.price;
    b.className = 'w-full rounded-lg px-3 py-1.5 text-left text-sm transition-colors ' +
      (on ? 'bg-chip font-semibold text-primary' : 'text-ink-soft hover:bg-chip hover:text-primary');
  });
}

/* ── wiring ────────────────────────────────────────────── */

let searchTimer;
$('[data-search]').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.q = e.target.value; apply(); }, 180);
});

$('[data-sort]').addEventListener('change', (e) => { state.sort = e.target.value; apply(); });

$('[data-price]').addEventListener('click', (e) => {
  const b = e.target.closest('[data-p]');
  if (!b) return;
  state.price = b.dataset.p;
  apply();
});

$('[data-reset]').addEventListener('click', () => {
  state.category = 'all';
  state.price = 'all';
  state.q = '';
  $('[data-search]').value = '';
  history.replaceState(null, '', 'books.html');
  apply();
});

/* ── load ──────────────────────────────────────────────── */

async function load() {
  const [books, cats] = await Promise.all([
    api.books(),
    api.categories().catch(() => []),
  ]);

  all = books;

  const counts = {};
  all.forEach((c) => {
    if (c.category_name) counts[c.category_name] = (counts[c.category_name] || 0) + 1;
  });

  const row = (value, label, n) =>
    '<button data-c="' + fmt.esc(value) + '" class="w-full rounded-lg px-3 py-1.5 text-left text-sm text-ink-soft">' +
      '<span class="flex items-center justify-between gap-2">' +
        '<span>' + fmt.esc(label) + '</span>' +
        '<span class="text-xs text-ink-muted">' + n + '</span>' +
      '</span></button>';

  $('[data-cats]').innerHTML =
    row('all', 'All specialities', all.length) +
    cats.filter((c) => c.is_active !== false)
        .map((c) => row(c.name, c.name, counts[c.name] || 0))
        .join('');

  $('[data-cats]').addEventListener('click', (e) => {
    const b = e.target.closest('[data-c]');
    if (!b) return;
    state.category = b.dataset.c;
    const url = state.category === 'all' ? 'books.html' : 'books.html?category=' + encodeURIComponent(state.category);
    history.replaceState(null, '', url);
    apply();
  });

  if (session.isLoggedIn) {
    try {
      const lib = await api.library(session.userId);
      (lib.books || []).forEach((b) => owned.add(String(b.book_id)));
    } catch (_) { /* a library failure must not blank the catalogue */ }
  }

  apply();
}

load().catch((e) => {
  $('[data-grid]').innerHTML = emptyState(
    'Could not load books',
    e.message || 'Something went wrong reaching the server.',
    '<button class="btn-primary btn-sm" onclick="location.reload()">Try again</button>'
  );
  toast(e.message || 'Could not load books.', 'error');
});
</script>
</body>
</html>
